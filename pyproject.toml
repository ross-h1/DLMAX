[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awen-dlmax"
# The IMPORT name stays `DLMAX`; only the distribution name is prefixed.
# PyPI rejects "dlmax" as confusable with the existing "dimax" (l/i/1 are
# treated as interchangeable to block typosquatting), and `awen-` claims a
# namespace rather than competing for a generic one.
version = "0.2.0"
description = "Dynamic Linear Models in JAX"
authors = [{name = "Ross Hollyman", email = "hello@awenforecasting.com"}]
# A project role address, not a personal one: `author_email` is PUBLIC and
# PERMANENT -- served by the PyPI JSON API and baked into every wheel, and an
# immutable release cannot be amended, only yanked. This one also outlives any
# institutional affiliation.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
# The distribution name is brand-led, so these carry the discoverability:
# PyPI search matches on description, keywords and classifiers.
keywords = [
    "dynamic linear models", "state space models", "bayesian forecasting",
    "model averaging", "time series", "forecasting", "jax", "kalman filter",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "h5py>=3.16.0",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]; sys_platform == 'linux'"]
# cross_validation(output="xarray") and the netCDF-writing paths.
xarray = ["xarray>=2023.1", "h5netcdf>=1.0"]

[project.urls]
Homepage = "https://github.com/ross-h1/DLMAX"
Repository = "https://github.com/ross-h1/DLMAX"
Issues = "https://github.com/ross-h1/DLMAX/issues"

[tool.setuptools.package-data]
# Ship the bundled example datasets (DLMAX.datasets) inside the wheel.
DLMAX = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
# Development tooling lives HERE and not in [project.optional-dependencies].
# Both existed until 0.2.0, with different contents: `uv sync` installs this
# group by default while `uv sync --extra dev` installed the extra, so the
# documented setup command and the default one produced different environments
# (ruff was in the extra and therefore never actually installed). PEP 735 groups
# are also absent from published metadata, which is correct -- `pip install
# awen-dlmax[dev]` should not exist, because ruff is not a feature of DLMAX.
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    # Not imported by the suite: these back cross_validation(output="xarray")
    # and the netCDF writers, which are exercised by hand.
    "xarray>=2023.1",
    "h5netcdf>=1.0",
]
docs = [
    "quartodoc>=0.11",
    # griffe 2.0 changed the parse_numpy signature that quartodoc 0.11 still
    # calls (allow_section_blank_line); pin to the 1.x line until quartodoc
    # supports griffe 2.x.
    "griffe>=1.5,<2",
    # Jupyter engine so Quarto can execute the {python} code blocks; matplotlib
    # and seaborn for the charts in docs/tutorials/*.ipynb. matplotlib is named
    # explicitly because it stopped being a core dependency in 0.2.0 -- it would
    # otherwise arrive only as a transitive dependency of seaborn.
    "jupyter",
    "ipykernel",
    "matplotlib>=3.8",
    "seaborn",
]
